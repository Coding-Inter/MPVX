# ============================================================================
#  mpv.conf  —  个人配置（单文件）
#  环境：mpv v0.42.0 / Windows 11
#  硬件：Intel Ultra 9 275HX + RTX 5070 Ti Laptop
#        屏幕 2560x1600 @ 300Hz，HDR 开启（10bit）
#
#  放置位置：portable_config\mpv.conf
#  行首 # 表示该行未启用
#
#  【预设组说明见文件末尾】
# ============================================================================

########
# 界面 #
########

osc=no          # 关掉内置 OSC，否则两套控制栏会重叠
title-bar=no    # 无边框模式。默认：no
osd-on-seek=no 	#关掉内置的快进播放条

# 关键：关掉 mpv 0.42 内置的 stats 脚本。
# 内置版会先占用脚本名 "stats"，导致 scripts\stats.lua 只能注册为 "stats2"，
# 而 OSC 按钮和 input.conf 里的 stats/... 绑定全部指向内置英文版。
# 关掉后，scripts\stats.lua 独占 "stats" 名称，中文界面才能生效。
load-stats-overlay=no

########
# 基础 #
########

# 记住每个文件的播放进度
save-position-on-quit=yes
# 只保存必要状态，避免 watch-later 条目臃肿
watch-later-options=start,vid,aid,sid

# 记录播放历史。不开这项，右键「打开 > 历史记录」永远提示
# "Enable --save-watch-history..." 并且列不出任何东西。
save-watch-history=yes

# 把文件路径以 "# D:\..." 明文写进 watch-later 存档。
# 不开这项，存档里只有 start=584.43 这类进度数字，没有文件名，
# 右键「打开 > 稍后观看」就列不出条目。
# 注意：只对之后新存的条目生效，之前的旧条目不会补上文件名。
write-filename-in-watch-later-config=yes

# 播放结束后保持窗口，不自动退出
keep-open=yes

# 拖拽窗口时不强制保持画面比例，更跟手
keepaspect-window=no

# 高分屏按 DPI 缩放
hidpi-window-scale=yes

# 启动后保持空闲窗口（需要常驻时取消注释）
#idle=yes


########
# 视频 #
########

# 基于 libplacebo 的渲染器，配 d3d11 走零拷贝
vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11

# 自动选择安全的硬解后端（本机实测走 d3d11va）
# 不要用 auto-copy，那会退化为显存→内存拷贝，白白浪费性能
hwdec=auto-safe
hwdec-codecs=h264,hevc,vp8,vp9,av1,vc1,mpeg2video

# 解码器直接写入 GPU 纹理，少一次拷贝
vd-lavc-dr=yes

# 缩放：高质量（5070 Ti 完全带得动）
scale=ewa_lanczossharp
dscale=mitchell
cscale=bilinear
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

# 抖动：auto 会匹配输出位深（你的屏幕 10bit）
dither-depth=auto

# 去色带：暗场渐变改善明显
deband=yes
deband-iterations=4
deband-threshold=35
deband-grain=24

# 隔行扫描自动处理
deinterlace=auto

# 插帧默认关闭（300Hz 下开销过大）。需要时用预设组 [interp]
interpolation=no
video-sync=audio


########
# HDR  #
########

# 关键：把输出色彩空间交给系统决定。
# 你的屏幕 HDR 处于开启状态，关掉这项会导致画面发灰、对比度错乱
target-colorspace-hint=yes

# 峰值亮度自动探测，不要手动填数字
hdr-compute-peak=auto

# 色调映射曲线
tone-mapping=bt.2390
gamut-mapping-mode=perceptual


########
# 缓存 #
########

cache=auto
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=256MiB
demuxer-readahead-secs=20

# 各类缓存独立存放，避免污染配置目录
icc-cache-dir=~~/_cache/icc
gpu-shader-cache-dir=~~/_cache/shader
watch-later-dir=~~/_cache/watch_later


########
# 音频 #
########

ao=wasapi
volume-max=150
audio-file-auto=fuzzy


#######
# OSD #
#######

osd-bar-w=100
osd-bar-h=1.8
osd-bar-align-y=-1
# 注意：颜色值必须加引号，否则 # 会被当作注释符而丢失
osd-color="#672168"
osd-outline-color="#EEEEEE"
osd-outline-size=0.8
osd-font-size=34
osd-fractions=yes

# 打开文件时显示文件名
osd-playing-msg=${filename}
osd-duration=2000
osd-playing-msg-duration=3000

# 拖拽进度时显示时间
osd-on-seek=msg


########
# 字幕 #
########

sub-auto=fuzzy
# 在以下子目录中查找外挂字幕
sub-file-paths=sub;Subs;subtitles
# 兼容 GBK/GB18030 编码的中文字幕
sub-codepage=GB18030

# 音轨/字幕优选顺序
slang=chs,sc,zh-cn,chi,zh,zh-tw,cht,zho,ze,eng,en
alang=jpn,ja,eng,en

# 字幕字体（系统自带）。若要用霞鹜文楷，把字体文件放入
# portable_config\fonts\ 后改为 sub-font=LXGW WenKai Mono Lite
sub-font=Ark Pixel 12px Prop zh-Hans
sub-font-size=48
sub-outline-size=3
sub-blur=1
sub-color="#FFD766"
sub-use-margins=yes

# ASS 字幕保留原始样式
sub-ass-override=no
sub-ass-force-margins=yes


########
# 截图 #
########

screenshot-format=png
screenshot-png-compression=4

# 保持 yes：你的片源和屏幕都是 10bit/HDR，
# 关掉会把截图压成 8bit 并丢失色彩空间标记
screenshot-tag-colorspace=yes
screenshot-high-bit-depth=yes

screenshot-template = "D:/image/%F-%P-N%n"


########
# 网络 #
########

ytdl=yes
ytdl-format=bestvideo[height<=?1080]+bestaudio/best


# ============================================================================
#  引入预设组
# ============================================================================
#
#  预设组（interp / battery / film / hq）单独存放在 profiles.conf，
#  说明与启用方法见该文件头部注释。
#
#  【重要】include 必须放在本文件靠后的位置，且只能**引入单个文件**。
#  实测 `include=~~/profiles/*.conf` 这类通配符写法无效（会报 Invalid argument）。
#
#  如需开机即启用某个预设，请把 profile=名字 写在**本文件最顶部**
#  （即所有 include 之前），不要写在这里。
#
# ============================================================================

include="~~/profiles.conf"    #个人配置文件

