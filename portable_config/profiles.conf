# ============================================================================
#  profiles.conf  —  预设组
#  由 mpv.conf 通过 include 引入：include=~~/profiles.conf
#
#  环境：mpv v0.42.0 / RTX 5070 Ti / 2560x1600@300Hz / HDR 开启
#
#
#    1. profile-cond 加空值判断（避免播放前的 nil 崩溃）
#    2. 所有 profile-cond 必须写成**单行**（见下方说明）
# ============================================================================
#
#  【两类预设】
#
#   A. 手动预设（无 profile-cond）
#      默认不生效，必须显式指定：
#          mpv.exe --profile=interp 影片.mkv
#      也可在 mpv.conf **最顶部**写 profile=interp 让它开机即启用。
#
#   B. 条件预设（有 profile-cond）
#      条件满足时**自动生效**，无需任何参数。
#      由内置脚本 auto_profiles.lua 在运行时持续求值。
#
#  【两个实测坑，务必注意】
#
#  坑1：profile-cond 不能换行续写
#      mpv 按行解析配置，换行后第二行会被丢弃，条件被截断。
#      例如写成两行：
#          profile-cond=p.file_size and p.duration
#            and p.duration>0 and (...)
#      实际只生效前半截 `p.file_size and p.duration and p.duration>0`，
#      这个表达式恒为真，导致条件预设**永远触发**（高码率片也去色带）。
#      → 所有条件必须写在同一行内。
#
#  坑2：播放开始前部分属性是 nil
#      mpv 0.42 在尚未加载文件时，file-size / duration / sig-peak 都是 nil，
#      直接参与比较会刷错误日志：
#          attempt to compare nil with number
#          attempt to perform arithmetic on field 'file-size' (a nil value)
#      → 每个条件前都用 p["属性"] and 做短路保护。
#
# ============================================================================


# ============================================================================
#  A. 手动预设（默认不生效）
# ============================================================================

[interp]
profile-desc=插帧：平滑运动（300Hz 下开销大，建议接电源时用）
interpolation=yes
video-sync=display-resample
tscale=oversample


[battery]
profile-desc=省电：降低 GPU 开销（笔记本电池模式）
scale=bilinear
dscale=bilinear
cscale=bilinear
correct-downscaling=no
sigmoid-upscaling=no
deband=no
dither-depth=no


[film]
profile-desc=补帧：24fps 片源做整数倍插值
interpolation=yes
video-sync=display-resample
tscale=sphinx


[hq]
profile-desc=高画质：进一步提升缩放质量（高端 GPU 适用）
scale=ewa_lanczos4sharpest
dscale=ewa_lanczossoft
cscale=ewa_lanczossoft
deband-iterations=6


# ============================================================================
#  B. 条件预设（自动生效，条件必须单行）
# ============================================================================


# --- 速度上下限保护 ------------------------------------------------------
[speed_limit1]
profile-desc=速度变化下限的控制（自动）
profile-cond=p.speed and p.speed<0.1
speed=0.1


[speed_limit2]
profile-desc=速度变化上限的控制（自动）
profile-cond=p.speed and p.speed>8
speed=8


# --- 播放时自动置顶 ------------------------------------------------------
[ontop_playback]
profile-desc=基于播放状态的自动置顶（自动）
profile-cond=(p["idle-active"]~=nil) and (not p["idle-active"])
profile-restore=copy
ontop=yes


# --- 帧率/倍速异常时改用音频同步 -----------------------------------------
# 片源高帧率(>32)、或屏幕刷新率不是片源整数倍(>3.2)、或变速播放时，
# 插帧会造成抖动，此时退回 audio 同步
[vsync_auto]
profile-desc=帧率或倍速异常时自动改用音频同步（自动）
profile-cond=(p["container-fps"] and p["container-fps"]>32) or (p["display-fps"] and p["container-fps"] and p["container-fps"]>0 and (p["display-fps"]/p["container-fps"])>3.2) or (p.speed and p.speed~=1)
profile-restore=copy
interpolation=no
video-sync=audio


# --- 低码率片源自动去色带 ------------------------------------------------
# 码率 ≤3000 kbps 时开启（低码率片源更容易出现色带）
[deband_bitrate]
profile-desc=基于码率的自动去色带（自动）
profile-cond=p["file-size"] and p.duration and p.duration>0 and ((p["file-size"]/1024)*8)/p.duration<=3000
profile-restore=copy
deband=yes


# --- 无需记录进度的情况 --------------------------------------------------
# 已看完 90%、或短片(≤300s)、或纯音频、或图片，则不保存播放进度
[save_props_auto]
profile-desc=基于进度或时长或轨道类型自动跳过保存进度（自动）
profile-cond=(p["percent-pos"] and p["percent-pos"]>=90) or (p.duration and p.duration<=300) or (p.vid==nil) or (p["current-tracks/video/albumart"]==true) or (p["current-tracks/video/image"]==true)
profile-restore=copy
save-position-on-quit=no


# --- HDR 片源通用处理 ----------------------------------------------------
# sig-peak>1 表示 HDR 片源（SDR 为 0）
[HDR_generic]
profile-desc=HDR 片源通用处理（自动）
profile-cond=p["video-params/sig-peak"] and p["video-params/sig-peak"]>1
profile-restore=copy
blend-subtitles=no
hdr-reference-white=100
hdr-peak-percentile=99.99
# 如需自定义色调映射，取消下面两行注释
#tone-mapping=hable
#gamut-mapping-mode=clip
