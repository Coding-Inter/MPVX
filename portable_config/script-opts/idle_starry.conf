# idle_starry.lua 的配置（改完按 Ctrl+Alt+i 热重载，或重开 mpv）

# 总开关
enabled=yes

# 动态层刷新率。20 已经够顺滑，调高会明显吃 CPU
fps=20

# 星星数量：均匀散布 + 银河带里额外聚集
star_count=210
band_stars=150

# 带十字光晕的亮星数量
bright_stars=9

# 会闪烁的星星占比（0 ~ 1）
twinkle_ratio=0.30

# 闪烁速度，越大越活泼
twinkle_speed=1.0

# 背景渐变分层数，越多越平滑（120 看不出色带）
band_count=120

# 夜空颜色：顶部深蓝、中段偏紫黑、底部近黑
bg_top=#0B1330
bg_mid=#070C22
bg_bottom=#02030A

# 银河带：倾角、宽度、聚集的星星数量
band_enabled=yes
band_angle=22
band_spread=0.115

# 银河雾状辉光。0 = 关闭，只靠星星密度表现银河
# 想让银河带更明显就调大，比如 20 ~ 30
band_glow=0
band_color=#5A6BAE
band_blur=22

# 星星颜色
star_color=#FFFFFF
star_color_cool=#B9CCFF
star_color_warm=#FFE6BE
bright_star_color=#DCEBFF

# 亮星是否画十字光晕
glow=yes

# 流星：interval 是平均间隔秒数（0 = 不出现）
shooting_star=yes
shooting_star_interval=13
shooting_star_color=#CFE4FF
